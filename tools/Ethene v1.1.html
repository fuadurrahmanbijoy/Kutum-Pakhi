<style>

nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:24px;z-index:5}
nav button{display:flex;align-items:center;border:0;background:none;color:var(--mut);font:600 14px inherit;height:44px;padding:0 12px;border-radius:18px;cursor:pointer;transition:background .3s,color .3s,padding .3s}
nav button span{max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .35s cubic-bezier(.3,.7,.2,1),margin .35s}
nav button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;padding:0 16px}nav button.on span{max-width:90px;margin-left:8px}
#hint{position:fixed;right:12px;top:calc(68px + env(safe-area-inset-top,0px));width:min(320px,calc(100vw - 24px));z-index:8;padding:13px 14px 16px;transform:translateX(calc(100% + 24px));opacity:0;transition:transform .5s cubic-bezier(.2,.9,.2,1),opacity .3s;pointer-events:none;overflow:hidden}
#hint.on{transform:none;opacity:1;pointer-events:auto}#hint h3{font-size:15px;margin-bottom:6px}#hint p{font-size:12.5px;color:var(--mut);margin-bottom:6px}#hint p b{color:var(--ink)}
#hint .x{position:absolute;right:10px;top:8px;border:0;background:none;color:var(--mut);font-size:19px;cursor:pointer}
#hint .bar2{position:absolute;left:0;bottom:0;height:3px;width:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transform-origin:left;transform:scaleX(0)}#hint.run .bar2{animation:pb 9s linear forwards}@keyframes pb{from{transform:scaleX(1)}to{transform:scaleX(0)}}

button:focus-visible,input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}

</style></head>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}catch(e){}
const S={bytes:null,doc:null,pj:null,N:0,bg:[255,255,255],name:''};
const C={lay:'two',k:6,left:'small',edge:'side',rev:0,rot:0,mode:'color',mg:0,fold:1,tag:1};
try{Object.assign(C,JSON.parse(localStorage.getItem('eth-c')||'{}'));const t=localStorage.getItem('eth-t');if(t)document.documentElement.dataset.theme=t}catch(e){}
let A={k:'',d:{}};try{A=JSON.parse(localStorage.getItem('eth-a'))||A}catch(e){}
const sv=()=>{try{localStorage.setItem('eth-c',JSON.stringify(C))}catch(e){}},svA=()=>{try{localStorage.setItem('eth-a',JSON.stringify(A))}catch(e){}};
let view='prep',pi=0,sgSel=-1;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2600)}
/* ---- imposition (theory: front P-2i | 1+2i, back 2+2i | P-1-2i) ---- */
const SP=()=>C.lay==='two'?4:2;
function plan(N){const sh=Math.ceil(N/SP()),k=Math.max(1,C.k),z=[];if(!sh)return z;const f=Math.floor(sh/k),r=sh%k;for(let i=0;i<f;i++)z.push(k);if(r){if(C.left==='merge'&&f)z[f-1]+=r;else z.push(C.left==='pad'?k:r)}return z}
function sheets(z){const o=[];let b=0;z.forEach((k,s)=>{if(C.lay==='two'){const P=4*k;for(let i=0;i<k;i++)o.push({s,i,f:[b+P-2*i-1,b+2*i],b:[b+2*i+1,b+P-2*i-2]});b+=P}else{for(let i=0;i<k;i++)o.push({s,i,f:[b+2*i],b:[b+2*i+1]});b+=2*k}});return o}
function selfTest(){const sv0={...C};let ok=true;for(const lay of['two','fold'])for(const left of['small','merge','pad'])for(let k=1;k<=8;k++)for(let N=1;N<=70;N++){Object.assign(C,{lay,left,k});const seen=sheets(plan(N)).flatMap(x=>[...x.f,...x.b]).filter(n=>n<N).sort((a,b)=>a-b);if(seen.length!==N||seen.some((n,i)=>n!==i))ok=false}
Object.assign(C,sv0);const t=sheets([1])[0];C.lay='two';const a=sheets([1])[0];Object.assign(C,sv0);return ok&&a.f.join()==='3,0'&&a.b.join()==='1,2'}
/* ---- PDF build ---- */
async function build(side,o={}){const {PDFDocument,rgb,degrees,StandardFonts}=PDFLib,two=C.lay==='two',W=two?841.89:595.28,H=two?595.28:841.89,hw=two?W/2:W,keep={...C};
if(o.test)Object.assign(C,{k:2,left:'small'});
try{const N=o.test?8:S.N,z=plan(N),all=sheets(z).filter(x=>o.only==null||x.s===o.only),bg=C.mode==='color'?rgb(...S.bg.map(v=>v/255)):rgb(1,1,1),d=await PDFDocument.create(),fnt=await d.embedFont(StandardFonts.HelveticaBold),emb=[];
if(!o.test){const need=[...new Set(all.flatMap(x=>[...x.f,...x.b]).filter(n=>n<N))].sort((a,b)=>a-b);(await d.embedPdf(S.doc||(S.doc=await PDFDocument.load(S.bytes,{ignoreEncryption:true})),need)).forEach((e,i)=>emb[need[i]]=e)}
let list=side==='x'?all.flatMap(s=>[[s,'f'],[s,'b']]):all.map(s=>[s,side]);if(C.rev&&side==='b')list.reverse();
const m=C.mg*2.835,pink=rgb(.76,.09,.36),gray=rgb(.45,.45,.45),erot=!!C.rot;
for(const[s,sd]of list){const p=d.addPage([W,H]);p.drawRectangle({x:0,y:0,width:W,height:H,color:bg});
s[sd].forEach((n,j)=>{if(n>=N)return;const x0=j*hw;
if(o.test){p.drawRectangle({x:x0+20,y:20,width:hw-40,height:H-40,borderWidth:2,borderColor:pink});const t=String(n+1);p.drawText(t,{x:x0+hw/2-fnt.widthOfTextAtSize(t,two?150:200)/2,y:H/2-50,size:two?150:200,font:fnt,color:pink});p.drawText((sd==='f'?'FRONT':'BACK')+'  ^ TOP',{x:x0+40,y:H-60,size:18,font:fnt,color:gray})}
else{const e=emb[n],sc=Math.min((hw-2*m)/e.width,(H-2*m)/e.height),w=e.width*sc,h=e.height*sc;p.drawPage(e,{x:x0+(hw-w)/2,y:(H-h)/2,xScale:sc,yScale:sc})}});
if(C.fold&&C.lay!=='flat')p.drawLine(two?{start:{x:W/2,y:0},end:{x:W/2,y:H},thickness:.4,color:gray,dashArray:[3,5]}:{start:{x:0,y:H/2},end:{x:W,y:H/2},thickness:.4,color:gray,dashArray:[3,5]});
if(C.tag){const t=`S${s.s+1}  ${s.i+1}/${z[s.s]}  ${sd==='f'?'F':'B'}`;p.drawText(t,{x:W/2-fnt.widthOfTextAtSize(t,6)/2,y:5,size:6,font:fnt,color:gray})}
if(sd==='b'&&erot)p.setRotation(degrees(180))}
return await d.save()}finally{Object.assign(C,keep)}}
async function out(nm,u8){const cl=window.claude&&await claude.use('downloads');if(cl)await cl.save({filename:nm,data:u8});else{const a=document.createElement('a');a.href=URL.createObjectURL(u8 instanceof Blob?u8:new Blob([u8],{type:'application/pdf'}));a.download=nm;a.click()}}
const slug=()=>(S.name||'Book').replace(/\.pdf$/i,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'Book';
const pad=(i,n)=>String(i).padStart(Math.max(2,String(n).length),'0'),SD={f:'Front',b:'Back',x:'Duplex'};
async function dl(side,o={}){try{toast('Building PDF…');const u8=await build(side,o),n=plan(S.N).length,nm=o.test?`Ethene_Test_${SD[side]}.pdf`:o.only!=null?`Ethene_${slug()}_Sig-${pad(o.only+1,n)}_${SD[side]}.pdf`:`Ethene_${slug()}_${SD[side]}.pdf`;await out(nm,u8);toast('Ready: '+nm)}catch(e){console.error(e);toast('Not saved')}}
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})(),crc=u=>{let c=-1;for(let i=0;i<u.length;i++)c=crcT[(c^u[i])&255]^(c>>>8);return(c^-1)>>>0};

['g2','Printing',[['Flip pile','edge',[['side','Like a book'],['top','Calendar']]],['Back order','rev',[[0,'Same'],[1,'Reversed']]],['Colour','mode',[['color','Colour'],['bw','B/W']]]]]];

const H={
'lay:two':'2-up|Two book pages per side, so one A4 landscape sheet holds 4 pages. The accepted method for folded signatures.|You fold sheets in half and nest them|You print one page per side',
'lay:fold':'1-up folded|One page per A4 portrait side. Each sheet is folded in half on its own, with a dashed guide line.|You want single folded leaves|You want the standard nested signature',
'lay:flat':'1-up flat|One page per A4 portrait side, no folding. Sheets stay flat and are stacked in order.|You bind loose sheets|You want folded signatures',
'per':'Sheets per signature|Physical sheets nested and folded together. Each sheet adds 4 pages in 2-up (2 in 1-up).|You know how thick a stack you can fold cleanly|You plan by page count',
'left:small':'Smaller last signature|The last signature holds only the sheets that remain.|You accept one thinner signature|Every signature must match',
'left:merge':'Merge into previous|Remaining sheets join the previous signature, which gets thicker.|You want no thin signature|Every signature must match',
'left:pad':'Pad to full signature|Blank pages complete the last signature.|Every signature must be identical|You want to save paper',

'rev:1':'Back order reversed|Back sheets run from last to first.|Your printer returns the pile reversed|A test print already matches',
'mode:color':'Colour|Samples the page background from inner pages and fills the whole sheet, margins and blanks included.|Your book has a tinted page colour|You print on plain white',
'mode:bw':'Black and white|Plain white background everywhere.|You print on white paper to save ink|Your pages have a coloured background',
'rot':'Back upside-down|Turns every back 180°. A safety switch for printers that behave differently.|Your test print shows upside-down backs|Backs already come out upright',
'fold':'Fold guide line|Draws a faint dashed line at the fold.|You want help creasing in the right place|You want a clean sheet',

let ht;function hint(k){const h=H[k];if(!h)return;const[t,d,p,a]=h.split('|'),e=$('#hint');$('#ht').textContent=t;$('#hd').textContent=d;$('#hp').innerHTML='<b>Pick it if</b> '+p;$('#ha').innerHTML='<b>Avoid it if</b> '+a;e.classList.remove('run');void e.offsetWidth;e.classList.add('on','run');clearTimeout(ht);ht=setTimeout(()=>e.classList.remove('on','run'),9000)}

$$('.seg').forEach(s=>s.onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=s.dataset.k;C[k]=isNaN(+b.dataset.v)?b.dataset.v:+b.dataset.v;sv();hint(k+':'+C[k]);render()});

function render(){const z=plan(S.N),sh=z.reduce((a,b)=>a+b,0),has=!!S.N,key=S.name+'|'+S.N+'|'+C.lay+C.k+C.left;

$$('.btn').forEach(b=>b.disabled=!has&&b.id!=='dT');

$('#dF').onclick=()=>dl('f',og());$('#dB').onclick=()=>dl('b',og());$('#dX').onclick=()=>dl('x',og());$('#dZ').onclick=dlZip;$('#dT').onclick=async()=>{await dl('f',{test:1});await dl('b',{test:1})};
/* ---- load ---- */
async function load(f){if(!f)return;$('#fsub').textContent='Reading…';
try{const bytes=new Uint8Array(await f.arrayBuffer());S.doc=await PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true});S.bytes=bytes;S.name=f.name;S.N=S.doc.getPageCount();S.pj=null;BM.clear();S.bg=[255,255,255];
try{S.pj=await pdfjsLib.getDocument({data:bytes.slice()}).promise;const idx=[2,3,4,5,6].filter(i=>i<=S.pj.numPages);if(!idx.length)idx.push(1);const cnt={};for(const i of idx){const pg=await S.pj.getPage(i),vp=pg.getViewport({scale:.3}),cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;const x=cv.getContext('2d',{willReadFrequently:true});await pg.render({canvasContext:x,viewport:vp}).promise;const p=x.getImageData(3,3,1,1).data,k=[p[0],p[1],p[2]].join();cnt[k]=(cnt[k]||0)+1}S.bg=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0][0].split(',').map(Number)}catch(e){S.pj=null}
$('#drop').classList.add('ok');$('#fsub').textContent=f.name+' · '+S.N+' pages';pi=0;sgSel=-1;render();toast(S.N+' pages loaded')}
catch(e){console.error(e);$('#fsub').textContent='Could not read that PDF. Try another file.'}}
const dr=$('#drop');$('#file').onchange=e=>load(e.target.files[0]);dr.ondragover=e=>{e.preventDefault();dr.classList.add('ov')};dr.ondragleave=()=>dr.classList.remove('ov');dr.ondrop=e=>{e.preventDefault();dr.classList.remove('ov');load(e.dataTransfer.files[0])};

const BM=new Map(),PW=340,PH=Math.round(PW*1.4142);
async function bmp(n){if(n>=S.N||!S.pj)return null;if(BM.has(n))return BM.get(n);const pg=await S.pj.getPage(n+1),v=pg.getViewport({scale:1}),sc=Math.min(PW/v.width,PH/v.height),vp=pg.getViewport({scale:sc}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;BM.set(n,c);if(BM.size>24)BM.delete(BM.keys().next().value);return c}
async function paint(cv,list){const x=cv.getContext('2d');cv.width=PW*list.length;cv.height=PH;x.fillStyle=C.mode==='color'?`rgb(${S.bg})`:'#fff';x.fillRect(0,0,cv.width,PH);

if(C.fold&&C.lay!=='flat'){x.strokeStyle='rgba(214,51,108,.5)';x.setLineDash([6,6]);x.beginPath();if(C.lay==='two'){x.moveTo(PW,0);x.lineTo(PW,PH)}else{x.moveTo(0,PH/2);x.lineTo(PW,PH/2)}x.stroke()}}

async function drawPrev(){const L=sheets(plan(S.N)),n=L.length;$('#ptag').style.display=n?'':'none';if(!n){return}pi=Math.min(pi,n-1);const x=L[pi],z=plan(S.N),fl=$('#card').classList.contains('flip'),pp=(fl?x.b:x.f).map(v=>v>=S.N?'–':v+1).join(' | ');

as=Math.min(as,z.length-1);const two=C.lay==='two',book=C.edge==='side',pg=C.lay==='two'?'A4 landscape':'A4 portrait';
const G0=[['g1','Print the fronts',`Open the Fronts PDF. Use ${pg}, scale 100%, no auto-fit, one side only. Keep the printed pile in order.`],
['g2','Print the backs',`Put the same pile back, flipped ${book?'like a book (around the vertical edge)':'like a calendar (over the top edge)'}, then print the Backs PDF.`],

<div class="wide" style="display:flex;flex-direction:column;gap:8px">${G0.map(x=>ro(x[0],x[1],x[2])).join('')}</div>

<div class="wide" style="display:flex;flex-direction:column;gap:8px">${P[as].st.map(t=>ro(`${as}${t[0]}`,t[1],t[2])).join('')}</div>`;
